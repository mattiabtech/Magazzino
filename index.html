<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Scanner QR v0.0</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 15px; background: #f4f4f9; color: #333; text-align: center; }
    h2 { margin-top: 5px; font-size: 18px; }
    #reader { width: 100%; max-width: 400px; margin: auto; border-radius: 8px; overflow: hidden; background: #000; min-height: 250px; }
    .log-container { max-width: 400px; margin: 15px auto; background: white; border: 1px solid #ccc; border-radius: 8px; padding: 10px; text-align: left; height: 200px; overflow-y: auto; font-family: monospace; font-size: 13px; }
    .log-item { border-bottom: 1px solid #eee; padding: 5px 0; word-break: break-all; }
    .btn-clear { background: #dc3545; color: white; border: none; padding: 8px 15px; font-size: 14px; border-radius: 6px; cursor: pointer; margin-top: 5px; }
  </style>
</head>
<body>

  <h2>Test Lettura QR - v0.0</h2>
  <p style="font-size: 13px; color: #666;">Inquadra un QR code per vedere la stringa grezza catturata:</p>

  <div id="reader"></div>

  <div style="margin-top: 15px; font-weight: bold; font-size: 14px; text-align: left; max-width: 400px; margin-left: auto; margin-right: auto;">
    Log stringhe lette:
  </div>
  <div id="logContainer" class="log-container">
    <div style="color: #999; text-align: center; margin-top: 70px;">In attesa di scansioni...</div>
  </div>

  <button class="btn-clear" onclick="pulisciLog()">Pulisci Log</button>

  <script>
    let html5QrCode = null;

    window.onload = function() {
      html5QrCode = new Html5Qrcode("reader");
      const config = { fps: 15, qrbox: { width: 250, height: 250 } };
      
      html5QrCode.start(
        { facingMode: "environment" }, 
        config, 
        onScanSuccess, 
        onScanFailure
      ).catch(err => {
        document.getElementById('logContainer'].innerHTML = `<div style="color:red;">Errore attivazione camera: ${err}</div>`;
      });
    };

    function onScanSuccess(decodedText) {
      const container = document.getElementById('logContainer');
      
      // Rimuoviamo il messaggio iniziale se presente
      if (container.querySelector('div[style*="color: #999"]')) {
        container.innerHTML = '';
      }

      const timestamp = new Date().toLocaleTimeString();
      const item = document.div ? document.createElement('div') : document.createElement('div');
      item.className = 'log-item';
      item.innerHTML = `[${timestamp}] <b style="color: #007bff;">${decodedText}</b>`;
      
      container.prepend(item); // Aggiunge in cima le più recenti
    }

    function onScanFailure(error) {
      // Ignoriamo gli errori di frame singolo in cui non vede il QR per non intasare la console
    }

    function pulisciLog() {
      document.getElementById('logContainer'].innerHTML = '<div style="color: #999; text-align: center; margin-top: 70px;">Log pulito. In attesa...</div>';
    }
  </script>
</body>
</html>
