<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magazzino - Scanner e Validazione OCR</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://unpkg.com/tesseract.js@v5/dist/tesseract.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f9; color: #333; }
    .container { max-width: 500px; margin: auto; padding: 20px; text-align: center; box-sizing: border-box; min-height: 100vh; display: flex; flex-direction: column; justify-content: space-between; position: relative; }
    
    .view { display: none; flex-direction: column; justify-content: space-between; flex-grow: 1; }
    .view.active { display: flex; }

    .content-area { flex-grow: 1; }

    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 10px; }
    
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 20px; text-align: left; }
    .card-center { text-align: center; }
    
    input[type="text"] { width: 80%; padding: 12px; font-size: 18px; border: 1px solid #ccc; border-radius: 6px; text-align: center; margin-bottom: 10px; box-sizing: border-box; }
    
    .btn { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; text-decoration: none; display: inline-block; margin-top: 10px; text-align: center; box-sizing: border-box; }
    .btn-green { background: #28a745; }
    .btn-gray { background: #6c757d; }
    .btn-info { background: #17a2b8; }

    .badge-me { background: #d4edda; color: #155724; padding: 10px; border-radius: 6px; font-weight: bold; margin: 15px 0; text-align: center; }
    .badge-other { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 6px; font-weight: bold; margin: 15px 0; text-align: center; }
    
    .test-box { 
      background: #e9ecef; 
      padding: 15px; 
      border-radius: 8px; 
      font-family: monospace; 
      font-size: 13px; 
      text-align: left; 
      margin: 15px 0; 
      white-space: pre-line; 
      line-height: 1.5;
    }
    
    .status-msg { margin: 10px 0; font-size: 14px; color: #d9534f; font-weight: bold; }
    
    .app-version {
      font-size: 12px;
      color: #999;
      text-align: left;
      padding: 10px 0;
      margin-top: auto;
    }

    #snapshotCanvas { display: none; }
  </style>
</head>
<body>

  <!-- VISTA 1: HOME -->
  <div id="home-view" class="view active">
    <div class="container">
      <div class="content-area">
        <h2>Magazzino - Validazione Etichetta</h2>
        
        <div class="card card-center">
          <p style="margin-top:0; font-size: 14px; color: #666;">Inserisci codice a 5 cifre:</p>
          <input type="text" id="manualInput" maxlength="5" placeholder="Es. 54161">
          <button class="btn" onclick="procediManualcode()">Vai al Dettaglio</button>
        </div>

        <div style="margin-top: 20px;">
          <p id="scannerStatus" style="margin: 0 0 5px 0; font-size: 14px; color: #666;">Inquadra il QR Code:</p>
          <div id="statusAlert" class="status-msg"></div>
          <div id="reader"></div>
        </div>

        <canvas id="snapshotCanvas"></canvas>

        <div class="card">
          <p style="margin-top:0; font-size: 14px; color: #666; font-weight: bold; text-align: center;">Gestione Dati (Backup)</p>
          <button class="btn btn-gray" style="margin-top: 5px;" onclick="esportaDati()">📥 Scarica Backup (JSON)</button>
          <label class="btn btn-info" style="margin-top: 10px; display: block; cursor: pointer;">
            📤 Ripristina Backup
            <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importaDati(event)">
          </label>
        </div>
      </div>

      <div class="app-version">v1.8</div>
    </div>
  </div>

  <!-- VISTA 2: DETTAGLIO -->
  <div id="detail-view" class="view">
    <div class="container">
      <div class="content-area">
        <div class="card card-center" style="margin-top: 10px;">
          <h2>Scheda Articolo Convalidata</h2>
          
          <div class="test-box" id="testLogOutput">
            Caricamento log...
          </div>

          <div id="revisionStatus"></div>

          <button id="revButton" class="btn btn-green" onclick="segnaRevisionato()">✔️ Segna come revisionato da me</button>
          <button class="btn btn-gray" onclick="tornaAllaHome()">⬅️ Torna alla Home / Scanner</button>
        </div>
      </div>

      <div class="app-version">v1.8</div>
    </div>
  </div>

  <script>
    let html5QrCode = null;
    let currentId = "";
    let isProcessing = false;

    window.onload = function() {
      history.replaceState({ view: 'home' }, "", "#home");
      
      window.onpopstate = function(event) {
        const detailView = document.getElementById('detail-view');
        if (detailView.classList.contains('active')) {
          tornaAllaHome(true);
        }
      };

      startScanner();
    };

    function startScanner() {
      isProcessing = false;
      document.getElementById('statusAlert').innerText = "";
      
      if (!html5QrCode) {
        html5QrCode = new Html5Qrcode("reader");
      }
      
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        onScanSuccess
      ).catch((err) => {
        console.error("Errore avvio fotocamera", err);
        document.getElementById('statusAlert').innerText = "Errore fotocamera. Controlla i permessi.";
      });
    }

    function onScanSuccess(decodedText) {
      if (isProcessing) return;
      isProcessing = true;

      const qrId = estraiIddetDaUrl(decodedText);
      
      let revisioni = {};
      try {
        revisioni = JSON.parse(localStorage.getItem('miei_revisionati') || "{}");
      } catch(e) {
        revisioni = {};
      }
      
      // Controllo robusto in memoria locale
      if (revisioni[qrId] && revisioni[qrId].typeCode) {
        document.getElementById('scannerStatus').innerText = "ID già in database! Apertura immediata...";
        let storedTypeCode = revisioni[qrId].typeCode;

        if(html5QrCode && html5QrCode.isScanning) {
          html5QrCode.stop().then(() => {
            mostraRisultato(qrId, storedTypeCode, "memorizzato", 100);
          }).catch(() => {
            mostraRisultato(qrId, storedTypeCode, "memorizzato", 100);
          });
        } else {
          mostraRisultato(qrId, storedTypeCode, "memorizzato", 100);
        }
        return;
      }

      // Se non è in database, esegue OCR
      document.getElementById('scannerStatus').innerText = "QR Rilevato! Analisi OCR in corso...";
      catturaFotogrammaEseguiOCR(qrId);
    }

    function catturaFotogrammaEseguiOCR(qrId) {
      const videoElement = document.querySelector('#reader video');
      
      if (!videoElement) {
        riavviaPerErrore("Impossibile accedere al feed fotocamera.");
        return;
      }

      const canvas = document.getElementById('snapshotCanvas');
      canvas.width = videoElement.videoWidth || 640;
      canvas.height = videoElement.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

      const dataURL = canvas.toDataURL('image/png');

      Tesseract.recognize(
        dataURL,
        'eng',
        { logger: m => console.log(m) }
      ).then(({ data: { text, confidence } }) => {
        validaEProcedi(qrId, text, confidence);
      }).catch(err => {
        console.error("Errore OCR:", err);
        riavviaPerErrore("Errore lettura OCR, nuovo tentativo...");
      });
    }

    function validaEProcedi(qrId, rawOcrText, confidence) {
      let cleanedText = rawOcrText.replace(/\D/g, '');

      if (cleanedText.length < 10) {
        riavviaPerErrore("OCR non completo. Riprovo...");
        return;
      }

      const stringId = cleanedText.substring(0, 5);

      if (stringId !== qrId) {
        riavviaPerErrore(`ID non corrispondenti! QR: ${qrId} vs Testo: ${stringId}`);
        return;
      }

      // Togliamo le prime 5 cifre (iddet) e prendiamo le successive 10 cifre
      const stringaSenzaId = cleanedText.substring(5);

      if (stringaSenzaId.length < 10) {
        riavviaPerErrore(`Stringa corta (${stringaSenzaId.length} cifre). Riprovo...`);
        return;
      }

      // Isola esattamente le 10 cifre del tipo oggetto
      const dieciCifreTipo = stringaSenzaId.substring(0, 10);

      // Regole su prefisso (0445 o 0470) e relativi sotto-codici
      const prefisso4 = dieciCifreTipo.substring(0, 4);
      const subCodice3 = dieciCifreTipo.substring(4, 7);

      const ammessi0445 = ['010', '110', '120', '115', '116', '117', '118', '124', '011'];
      const ammessi0470 = ['004', '006', '504', '506'];

      let codiceValido = false;

      if (prefisso4 === '0445' && ammessi0445.includes(subCodice3)) {
        codiceValido = true;
      } else if (prefisso4 === '0470' && ammessi0470.includes(subCodice3)) {
        codiceValido = true;
      }

      if (!codiceValido) {
        riavviaPerErrore(`Prefisso/Codice non valido (${prefisso4}-${subCodice3})`);
        return;
      }

      if(html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => {
          mostraRisultato(qrId, dieciCifreTipo, "scansionato", Math.round(confidence));
        }).catch(() => {
          mostraRisultato(qrId, dieciCifreTipo, "scansionato", Math.round(confidence));
        });
      } else {
        mostraRisultato(qrId, dieciCifreTipo, "scansionato", Math.round(confidence));
      }
    }

    function riavviaPerErrore(messaggio) {
      document.getElementById('statusAlert').innerText = messaggio;
      document.getElementById('scannerStatus').innerText = "Inquadra il QR Code:";
      setTimeout(() => {
        isProcessing = false;
      }, 1500);
    }

    function estraiIddetDaUrl(testo) {
      try {
        const url = new URL(testo);
        const iddet = url.searchParams.get("iddet");
        return iddet ? iddet : testo;
      } catch (e) {
        return testo;
      }
    }

    function procediManualcode() {
      const val = document.getElementById('manualInput').value.trim();
      if(!val) {
        alert("Inserisci un codice valido!");
        return;
      }
      
      let azioneStop = Promise.resolve();
      if(html5QrCode && html5QrCode.isScanning) {
        azioneStop = html5QrCode.stop().catch(() => {});
      }
      
      azioneStop.then(() => {
        mostraRisultato(val, "0445000000", "manuale", 100);
      });
    }

    function mostraRisultato(qrId, codiceTipo, statoOcr, confidenza) {
      currentId = qrId;

      const logTesto = 
`QR: ${qrId} riconosciuto
OCR: ${statoOcr} / ${codiceTipo}
probabilità (${confidenza}% ${statoOcr === 'memorizzato' ? 'se memorizzato' : ''})

risultato finale

id: ${qrId}
codice ${codiceTipo}`;

      document.getElementById('testLogOutput').innerText = logTesto;

      let revisioni = {};
      try {
        revisioni = JSON.parse(localStorage.getItem('miei_revisionati') || "{}");
      } catch(e) {
        revisioni = {};
      }

      const statusDiv = document.getElementById('revisionStatus');
      const revButton = document.getElementById('revButton');

      if (revisioni[currentId] && revisioni[currentId].revised) {
        statusDiv.innerHTML = `<div class="badge-me">✅ Questo articolo è stato revisionato da TE.</div>`;
        revButton.style.display = 'none';
      } else {
        statusDiv.innerHTML = `<div class="badge-other">⚠️ Non ancora revisionato da te.</div>`;
        revButton.style.display = 'inline-block';
      }

      document.getElementById('home-view').classList.remove('active');
      document.getElementById('detail-view').classList.add('active');
      
      if (location.hash !== "#detail") {
        history.pushState({ view: 'detail' }, "", "#detail");
      }
    }

    function segnaRevisionato() {
      let revisioni = {};
      try {
        revisioni = JSON.parse(localStorage.getItem('miei_revisionati') || "{}");
      } catch(e) {
        revisioni = {};
      }
      
      const logLines = document.getElementById('testLogOutput').innerText.split('\n');
      const ultimaLinea = logLines[logLines.length - 1] || "";
      const codiceSalvato = ultimaLinea.replace("codice ", "").trim();

      // Salva correttamente l'oggetto strutturato con il codice associato
      revisioni[currentId] = {
        revised: true,
        typeCode: codiceSalvato,
        rawText: codiceSalvato
      };
      
      localStorage.setItem('miei_revisionati', JSON.stringify(revisioni));
      
      alert("Salvato! Articolo segnato come revisionato da te.");
      mostraRisultato(currentId, codiceSalvato, "memorizzato", 100);
    }

    function tornaAllaHome(fromPopState = false) {
      isProcessing = false;
      document.getElementById('statusAlert').innerText = "";
      document.getElementById('scannerStatus').innerText = "Inquadra il QR Code:";

      document.getElementById('detail-view').classList.remove('active');
      document.getElementById('home-view').classList.add('active');
      document.getElementById('manualInput').value = '';
      
      if (!fromPopState && location.hash !== "#home") {
        history.pushState({ view: 'home' }, "", "#home");
      }
      
      startScanner();
    }

    function esportaDati() {
      const dati = localStorage.getItem('miei_revisionati') || "{}";
      const blob = new Blob([dati], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `backup_revisioni_${new Date().toISOString().slice(0,10)}.json`;
      
      document.body.appendChild(a);
      a.click();
      setTimeout(() => {
        document.body.removeChild(a);
        window.URL.revokeObjectURL(url);
      }, 100);
    }

    function importaDati(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const contenuto = JSON.parse(e.target.result);
          localStorage.setItem('miei_revisionati', JSON.stringify(contenuto));
          alert("Backup ripristinato con successo!");
          event.target.value = '';
        } catch (err) {
          alert("Errore nella lettura del file JSON.");
        }
      };
      reader.readAsText(file);
    }
  </script>
</body>
</html>
