<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magazzino - Test OCR e Affidabilità</title>
  <!-- Librerie Scanner QR e OCR (Tesseract) -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <script src="https://unpkg.com/tesseract.js@v5/dist/tesseract.min.js"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f9; color: #333; }
    .container { max-width: 500px; margin: auto; padding: 20px; text-align: center; box-sizing: border-box; }
    
    .view { display: none; }
    .view.active { display: block; }

    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 10px; }
    
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 20px; text-align: left; }
    .card-center { text-align: center; }
    
    input[type="text"] { width: 80%; padding: 12px; font-size: 18px; border: 1px solid #ccc; border-radius: 6px; text-align: center; margin-bottom: 10px; box-sizing: border-box; }
    
    .btn { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; text-decoration: none; display: inline-block; margin-top: 10px; text-align: center; box-sizing: border-box; }
    .btn-green { background: #28a745; }
    .btn-gray { background: #6c757d; }
    .btn-info { background: #17a2b8; }

    .badge-me { background: #d4edda; color: #155724; padding: 10px; border-radius: 6px; font-weight: bold; margin: 15px 0; text-align: center; }
    .badge-other { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 6px; font-weight: bold; margin: 15px 0; text-align: center; }
    
    /* Box per i risultati di test */
    .test-box { background: #e9ecef; padding: 12px; border-radius: 6px; font-family: monospace; font-size: 14px; text-align: left; margin: 15px 0; word-break: break-all; }
    
    #snapshotCanvas { display: none; }
  </style>
</head>
<body>

  <!-- VISTA 1: HOME -->
  <div id="home-view" class="view active">
    <div class="container">
      <h2>Magazzino - Test OCR & Confidenza</h2>
      
      <div class="card card-center">
        <p style="margin-top:0; font-size: 14px; color: #666;">Inserisci codice a 5 cifre:</p>
        <input type="text" id="manualInput" maxlength="5" placeholder="Es. 54161">
        <button class="btn" onclick="procediManualcode()">Vai al Dettaglio</button>
      </div>

      <div style="margin-top: 20px;">
        <p id="scannerStatus" style="margin: 0 0 5px 0; font-size: 14px; color: #666;">Inquadra il QR Code:</p>
        <div id="reader"></div>
      </div>

      <canvas id="snapshotCanvas"></canvas>

      <div class="card">
        <p style="margin-top:0; font-size: 14px; color: #666; font-weight: bold; text-align: center;">Gestione Dati (Backup)</p>
        <button class="btn btn-gray" style="margin-top: 5px;" onclick="esportaDati()">📥 Scarica Backup (JSON)</button>
        <label class="btn btn-info" style="margin-top: 10px; display: block; cursor: pointer;">
          📤 Ripristina Backup
          <input type="file" id="importFile" accept=".json" style="display: none;" onchange="importaDati(event)">
        </label>
      </div>
    </div>
  </div>

  <!-- VISTA 2: PAGINA DETTAGLIO / TEST -->
  <div id="detail-view" class="view">
    <div class="container">
      <div class="card card-center">
        <h2>Scheda Articolo & Test</h2>
        <p style="font-size: 18px; margin: 10px 0;">Codice ID Finale: <strong id="detId">-----</strong></p>
        
        <div class="test-box" id="testOutput">
          <b>Dati di Test OCR/QR:</b><br>
          - IDdet dal QR: <span id="testQrId">-</span><br>
          - Stringa letta sotto: <span id="testRawString">-</span><br>
          - IDdet dalla stringa: <span id="testStringId">-</span><br>
          - <b>Affidabilità OCR:</b> <span id="testConfidence">-</span>%
        </div>

        <div id="revisionStatus"></div>

        <button id="revButton" class="btn btn-green" onclick="segnaRevisionato()">✔️ Segna come revisionato da me</button>
        <button class="btn btn-gray" onclick="tornaAllaHome()">⬅️ Torna alla Home / Scanner</button>
      </div>
    </div>
  </div>

  <script>
    let html5QrCode;
    let currentId = "";

    window.onload = function() {
      startScanner();
    };

    function startScanner() {
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        onScanSuccess
      ).catch((err) => {
        console.error("Errore avvio fotocamera", err);
      });
    }

    function onScanSuccess(decodedText) {
      const qrId = estraiIddetDaUrl(decodedText);
      document.getElementById('scannerStatus').innerText = "QR rilevato! Lettura testo in corso...";
      catturaFotogrammaEseguiOCR(qrId);
    }

    function catturaFotogrammaEseguiOCR(qrId) {
      const videoElement = document.querySelector('#reader video');
      
      if (!videoElement) {
        apriDettaglio(qrId, qrId, "N/A", 0);
        return;
      }

      const canvas = document.getElementById('snapshotCanvas');
      canvas.width = videoElement.videoWidth || 640;
      canvas.height = videoElement.videoHeight || 480;
      const ctx = canvas.getContext('2d');
      ctx.drawImage(videoElement, 0, 0, canvas.width, canvas.height);

      const dataURL = canvas.toDataURL('image/png');

      html5QrCode.stop().then(() => {
        Tesseract.recognize(
          dataURL,
          'eng',
          { logger: m => console.log(m) }
        ).then(({ data: { text, confidence } }) => {
          elaboraRisultatiTest(qrId, text, confidence);
        }).catch(err => {
          console.error("Errore OCR:", err);
          elaboraRisultatiTest(qrId, "Errore OCR", 0);
        });
      }).catch(err => {
        console.error(err);
        apriDettaglio(qrId, qrId, "Errore arresto scanner", 0);
      });
    }

    function elaboraRisultatiTest(qrId, rawOcrText, confidence) {
      let cleanedText = rawOcrText.replace(/\D/g, '');
      let stringId = cleanedText.length >= 5 ? cleanedText.substring(0, 5) : cleanedText;
      
      apriDettaglio(qrId, stringId, rawOcrText.trim(), Math.round(confidence));
    }

    function estraiIddetDaUrl(testo) {
      try {
        const url = new URL(testo);
        const iddet = url.searchParams.get("iddet");
        return iddet ? iddet : testo;
      } catch (e) {
        return testo;
      }
    }

    function procediManualcode() {
      const val = document.getElementById('manualInput').value.trim();
      if(!val) {
        alert("Inserisci un codice valido!");
        return;
      }
      if(html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => apriDettaglio(val, val, "Inserimento manuale", 100)).catch(() => apriDettaglio(val, val, "Inserimento manuale", 100));
      } else {
        apriDettaglio(val, val, "Inserimento manuale", 100);
      }
    }

    function apriDettaglio(qrId, stringId, rawText, confidence) {
      currentId = qrId;
      document.getElementById('detId').innerText = qrId;

      // Stampa i dati aggiornati compresa la percentuale di confidenza
      document.getElementById('testQrId').innerText = qrId;
      document.getElementById('testRawString').innerText = rawText;
      document.getElementById('testStringId').innerText = stringId;
      document.getElementById('testConfidence').innerText = confidence;

      const revisioni = JSON.parse(localStorage.getItem('miei_revisionati') || "{}");
      const statusDiv = document.getElementById('revisionStatus');
      const revButton = document.getElementById('revButton');

      if (revisioni[currentId]) {
        statusDiv.innerHTML = `<div class="badge-me">✅ Questo articolo è stato revisionato da TE.</div>`;
        revButton.style.display = 'none';
      } else {
        statusDiv.innerHTML = `<div class="badge-other">⚠️ Non ancora revisionato da te.</div>`;
        revButton.style.display = 'inline-block';
      }

      document.getElementById('home-view').classList.remove('active');
      document.getElementById('detail-view').classList.add('active');
    }

    function segnaRevisionato() {
      const revisioni = JSON.parse(localStorage.getItem('miei_revisionati') || "{}");
      revisioni[currentId] = true;
      localStorage.setItem('miei_revisionati', JSON.stringify(revisioni));
      
      alert("Salvato! Articolo segnato come revisionato da te.");
      apriDettaglio(currentId, document.getElementById('testStringId').innerText, document.getElementById('testRawString').innerText, document.getElementById('testConfidence').innerText);
    }

    function esportaDati() {
      const dati = localStorage.getItem('miei_revisionati') || "{}";
      const blob = new Blob([dati], { type: 'application/json' });
      const url = URL.createObjectURL(blob);
      const a = document.createElement('a');
      a.href = url;
      a.download = `backup_revisioni_${new Date().toISOString().slice(0,10)}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
    }

    function importaDati(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        try {
          const contenuto = JSON.parse(e.target.result);
          localStorage.setItem('miei_revisionati', JSON.stringify(contenuto));
          alert("Backup ripristinato con successo!");
          event.target.value = '';
        } catch (err) {
          alert("Errore nella lettura del file.");
        }
      };
      reader.readAsText(file);
    }

    function tornaAllaHome() {
      document.getElementById('detail-view').classList.remove('active');
      document.getElementById('home-view').classList.add('active');
      document.getElementById('manualInput').value = '';
      document.getElementById('scannerStatus').innerText = "Inquadra il QR Code:";
      startScanner();
    }
  </script>
</body>
</html>
