<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>QR Scanner a Pagina Bianca</title>
  <!-- Libreria Scanner QR -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f9; }
    #scanner-container { max-width: 500px; margin: auto; padding: 20px; text-align: center; }
    #reader { width: 100%; border-radius: 8px; overflow: hidden; }
    
    /* Stile della "pagina bianca" che appare al rilevamento */
    #result-page {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #ffffff;
      z-index: 9999;
      padding: 40px 20px;
      box-sizing: border-box;
      text-align: center;
      overflow-y: auto;
    }
    #result-page h2 { color: #333; margin-bottom: 10px; }
    #scanned-text { 
      font-size: 20px; 
      color: #111; 
      background: #f8f9fa; 
      padding: 15px; 
      border-radius: 8px; 
      border: 1px solid #ddd;
      word-break: break-all; 
      margin: 20px 0; 
    }
    .btn { 
      background: #007bff; 
      color: white; 
      border: none; 
      padding: 12px 25px; 
      font-size: 16px; 
      border-radius: 5px; 
      cursor: pointer; 
      text-decoration: none; 
      display: inline-block;
      margin-top: 15px;
    }
    .btn-green { background: #28a745; margin-right: 10px; }
  </style>
</head>
<body>

  <div id="scanner-container">
    <h2>Scanner QR Code</h2>
    <p style="color: #666; font-size: 14px;">Inquadra un codice con la fotocamera</p>
    <div id="reader"></div>
  </div>

  <!-- La pagina bianca dei risultati -->
  <div id="result-page">
    <h2>QR Code Rilevato!</h2>
    <p style="color: #666;">Contenuto del codice:</p>
    <div id="scanned-text"></div>
    
    <div id="action-container"></div>
    <br><br>
    <button class="btn" onclick="resetScanner()">🔄 Scansiona un altro</button>
  </div>

  <script>
    let html5QrCode;

    function onScanSuccess(decodedText, decodedResult) {
      // Ferma la fotocamera temporaneamente
      html5QrCode.stop().then(() => {
        // Inserisce il testo nella pagina bianca
        document.getElementById('scanned-text').innerText = decodedText;
        
        const actionContainer = document.getElementById('action-container');
        actionContainer.innerHTML = '';

        // Se il testo è un URL valido, mostra il tasto per aprirlo
        if (decodedText.startsWith('http://') || decodedText.startsWith('https://')) {
          const linkBtn = document.createElement('a');
          linkBtn.href = decodedText;
          linkBtn.innerText = '🌐 Apri Link';
          linkBtn.className = 'btn btn-green';
          linkBtn.target = '_blank';
          actionContainer.appendChild(linkBtn);
        }

        // Mostra la pagina bianca
        document.getElementById('result-page').style.display = 'block';
      }).catch((err) => {
        console.error("Errore nell'arresto dello scanner", err);
      });
    }

    function resetScanner() {
      // Nasconde la pagina bianca e riavvia la fotocamera
      document.getElementById('result-page').style.display = 'none';
      startScanner();
    }

    function startScanner() {
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" }, // Usa la fotocamera posteriore
        { fps: 10, qrbox: { width: 250, height: 250 } },
        onScanSuccess
      ).catch((err) => {
        console.error("Errore avvio fotocamera", err);
        alert("Impossibile accedere alla fotocamera. Assicurati di dare i permessi e di usare HTTPS o Localhost.");
      });
    }

    // Avvia lo scanner all'apertura
    window.onload = function() {
      startScanner();
    };
  </script>
</body>
</html>
