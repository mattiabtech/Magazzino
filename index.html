<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Magazzino - Scanner e Revisione</title>
  <!-- Libreria Scanner QR -->
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    body { font-family: sans-serif; margin: 0; padding: 0; background: #f4f4f9; color: #333; }
    .container { max-width: 500px; margin: auto; padding: 20px; text-align: center; box-sizing: border-box; }
    
    /* Viste (Home e Dettaglio) */
    .view { display: none; }
    .view.active { display: block; }

    #reader { width: 100%; border-radius: 8px; overflow: hidden; margin-top: 10px; }
    
    .card { background: white; padding: 20px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-top: 20px; }
    
    input[type="text"] { width: 80%; padding: 12px; font-size: 18px; border: 1px solid #ccc; border-radius: 6px; text-align: center; margin-bottom: 10px; }
    
    .btn { background: #007bff; color: white; border: none; padding: 12px 20px; font-size: 16px; border-radius: 6px; cursor: pointer; width: 100%; text-decoration: none; display: inline-block; margin-top: 10px; }
    .btn-green { background: #28a745; }
    .btn-gray { background: #6c757d; }

    .badge-me { background: #d4edda; color: #155724; padding: 10px; border-radius: 6px; font-weight: bold; margin: 15px 0; }
    .badge-other { background: #f8d7da; color: #721c24; padding: 10px; border-radius: 6px; font-weight: bold; margin: 15px 0; }
  </style>
</head>
<body>

  <!-- VISTA 1: HOME (Scanner QR + Form Manuale) -->
  <div id="home-view" class="view active">
    <div class="container">
      <h2>Magazzino - Scanner</h2>
      
      <!-- Form manuale a 5 cifre -->
      <div class="card">
        <p style="margin-top:0; font-size: 14px; color: #666;">Inserisci codice a 5 cifre:</p>
        <input type="text" id="manualInput" maxlength="5" placeholder="Es. 52855">
        <button class="btn" onclick="procediManualcode()">Vai al Dettaglio</button>
      </div>

      <p style="margin: 20px 0 5px 0; font-size: 14px; color: #666;">Oppure inquadra il QR Code:</p>
      <div id="reader"></div>
    </div>
  </div>

  <!-- VISTA 2: PAGINA DETTAGLIO -->
  <div id="detail-view" class="view">
    <div class="container">
      <div class="card">
        <h2>Scheda Articolo</h2>
        <p style="font-size: 18px; margin: 10px 0;">Codice ID: <strong id="detId">-----</strong></p>
        
        <div id="revisionStatus"></div>

        <button id="revButton" class="btn btn-green" onclick="segnaRevisionato()">✔️ Segna come revisionato da me</button>
        <button class="btn btn-gray" onclick="tornaAllaHome()">⬅️ Torna alla Home / Scanner</button>
      </div>
    </div>
  </div>

  <script>
    let html5QrCode;
    let currentId = "";

    // Avvia lo scanner all'avvio
    window.onload = function() {
      startScanner();
    };

    function startScanner() {
      html5QrCode = new Html5Qrcode("reader");
      html5QrCode.start(
        { facingMode: "environment" },
        { fps: 10, qrbox: { width: 220, height: 220 } },
        onScanSuccess
      ).catch((err) => {
        console.error("Errore avvio fotocamera", err);
      });
    }

    // Gestisce il successo della scansione QR
    function onScanSuccess(decodedText) {
      // Ferma la fotocamera ed estrae iddet dal link es. https://.../?iddet=52855&...
      html5QrCode.stop().then(() => {
        let codiceEstratto = estraiIddetDaUrl(decodedText);
        apriDettaglio(codiceEstratto);
      }).catch(err => console.error(err));
    }

    // Funzione per estrarre il parametro iddet dal link o usare il testo diretto
    function estraiIddetDaUrl(testo) {
      try {
        const url = new URL(testo);
        const iddet = url.searchParams.get("iddet");
        return iddet ? iddet : testo; // Se c'è iddet lo usa, altrimenti prende tutto il testo
      } catch (e) {
        return testo; // Se non è un URL valido, restituisce il testo così com'è
      }
    }

    // Gestione invio manuale dal form
    function procediManualcode() {
      const val = document.getElementById('manualInput').value.trim();
      if(!val) {
        alert("Inserisci un codice valido!");
        return;
      }
      // Ferma lo scanner se attivo prima di cambiare vista
      if(html5QrCode && html5QrCode.isScanning) {
        html5QrCode.stop().then(() => apriDettaglio(val)).catch(() => apriDettaglio(val));
      } else {
        apriDettaglio(val);
      }
    }

    // Passa alla pagina di dettaglio e verifica chi ha fatto la revisione
    apriDettaglio = function(id) {
      currentId = id;
      document.getElementById('detId').innerText = id;
      
      // Controlliamo in locale (localStorage) se è stato revisionato da "me"
      // Salviamo un oggetto JSON dove la chiave è l'ID articolo
      const revisioni = JSON.parse(localStorage.getItem('miei_revisionati') || "{}");
      const statusDiv = document.getElementById('revisionStatus');
      const revButton = document.getElementById('revButton');

      if (revisioni[id]) {
        statusDiv.innerHTML = `<div class="badge-me">✅ Questo articolo è stato revisionato da TE.</div>`;
        revButton.style.display = 'none'; // Già fatto da te
      } else {
        // Simuliamo o controlliamo se è stato fatto da qualcun altro (puoi personalizzare la logica)
        // Per ora mettiamo lo stato neutro o simulato
        statusDiv.innerHTML = `<div class="badge-other">⚠️ Revisionato da qualcun altro (o non ancora revisionato da te).</div>`;
        revButton.style.display = 'inline-block';
      }

      // Cambia vista
      document.getElementById('home-view').classList.remove('active');
      document.getElementById('detail-view').classList.add('active');
    }

    // Azione per segnare l'articolo revisionato da me
    function segnaRevisionato() {
      const revisioni = JSON.parse(localStorage.getItem('miei_revisionati') || "{}");
      revisioni[currentId] = true;
      localStorage.setItem('miei_revisionati', JSON.stringify(revisioni));
      
      alert("Salvato! Articolo segnato come revisionato da te.");
      apriDettaglio(currentId); // Aggiorna la schermata
    }

    // Torna alla home e riattiva la fotocamera
    function tornaAllaHome() {
      document.getElementById('detail-view').classList.remove('active');
      document.getElementById('home-view').classList.add('active');
      document.getElementById('manualInput').value = '';
      startScanner();
    }
  </script>
</body>
</html>
